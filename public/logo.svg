<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d77ff"/>
      <stop offset="100%" stop-color="#80db66"/>
    </linearGradient>
    <linearGradient id="logoFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111b2e"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon (stroke only) -->
  <polygon
    points="100,10 186.6,55 186.6,145 100,190 13.4,145 13.4,55"
    fill="none"
    stroke="url(#logoGrad)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Filled hexagon inside -->
  <polygon
    points="100,18 180,58 180,142 100,182 20,142 20,58"
    fill="url(#logoFill)"
    stroke="none"
  />

  <!-- Inner accent hexagon (thin) -->
  <polygon
    points="100,30 170,65 170,135 100,170 30,135 30,65"
    fill="none"
    stroke="rgba(128,219,102,0.1)"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- m text -->
  <text
    x="100"
    y="118"
    font-family="'Space Grotesk', 'Arial', sans-serif"
    font-size="68"
    font-weight="700"
    fill="#80db66"
    text-anchor="middle"
    letter-spacing="2"
  >m</text>

  <!-- Decorative line under text -->
  <line x1="65" y1="128" x2="135" y2="128" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>
